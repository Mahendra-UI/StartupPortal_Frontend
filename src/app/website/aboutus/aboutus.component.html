<section class="py-5"
    style="position: relative;z-index: 0;
    overflow: hidden;background-image: url('assets/images/about/about_bg1.png');background-size:cover;background-repeat: no-repeat;background-position: center;">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-7">
                <div class="inner_content pe-3">

                    <div class="innerpage_heading mb-3">
                        <h2>About Us</h2>
                    </div>
                    <p [className]="isTranslationTelugu ? 'aboutupara' : ''">
                        {{ 'Aboutcontent.aboutusparaone' | translate }}
                    </p>
                    <p [className]="isTranslationTelugu ? 'aboutupara' : ''">
                        {{ 'Aboutcontent.aboutusparatwo' | translate }}
                    </p>
                </div>
            </div>
            <div class="col-md-5">
                <div class="about_image text-center">
                    <!-- <video  playsinline="playsinline" height="200" style="width: 100%;outline: none!important;" loop="loop" controls>
                        <source src="assets/images/APIS Promotion.mp4" type="video/mp4">
                      </video> -->
                    <img src="assets/images/about/about_innovative.png" alt="image" class="img-fluid pt-2" style="max-width: 60%;margin: auto">
                </div>
            </div>
            <div class="col-md-12">
                <div class="gallery pt-3">
                    <owl-carousel-o [options]="customOptions">
                        <ng-template carouselSlide>
                            <div class="img_box">
                                <img src="assets/images/gallery/apis/dronesummit/1.jpg" alt="image" class="img-fluid">
                                <!-- <img src="assets/images/about/1.png" alt="" class="img-fluid"> -->
                            </div>
                        </ng-template>
                        <ng-template carouselSlide>
                            <div class="img_box">
                                <img src="assets/images/gallery/apis/dronesummit/2.jpg" alt="image" class="img-fluid">
                                <!-- <img src="assets/images/gallery/2.jpg" alt="" class="img-fluid"> -->
                            </div>
                        </ng-template>
                        <ng-template carouselSlide>
                            <div class="img_box">
                                <img src="assets/images/gallery/apis/dronesummit/3.jpg" alt="image" class="img-fluid">
                                <!-- <img src="assets/images/gallery/3.jpg" alt="" class="img-fluid"> -->
                            </div>
                        </ng-template>
                        <ng-template carouselSlide>
                            <div class="img_box">
                                <img src="assets/images/gallery/apis/dronesummit/4.jpg" alt="image" class="img-fluid">
                                <!-- <img src="assets/images/gallery/3.jpg" alt="" class="img-fluid"> -->
                            </div>
                        </ng-template>
                        <ng-template carouselSlide>
                            <div class="img_box">
                                <img src="assets/images/gallery/apis/apdts/1.jpg" alt="image" class="img-fluid">
                                <!-- <img src="assets/images/gallery/4.jpg" alt="" class="img-fluid"> -->
                            </div>
                        </ng-template>

                        <ng-template carouselSlide>
                            <div class="img_box">
                                <img src="assets/images/gallery/apis/apdts/2.jpg" alt="image" class="img-fluid">
                                <!-- <img src="assets/images/gallery/5.jpg" alt="" class="img-fluid"> -->
                            </div>
                        </ng-template>

                        <ng-template carouselSlide>
                            <div class="img_box">
                                <img src="assets/images/gallery/apis/apdts/3.jpg" alt="image" class="img-fluid">
                                <!-- <img src="assets/images/gallery/6.jpg" alt="" class="img-fluid"> -->
                            </div>
                        </ng-template>
                    </owl-carousel-o>
                </div>
            </div>
        </div>
    </div>
</section>
